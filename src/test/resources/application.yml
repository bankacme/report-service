# Reemplaza a src/main/resources/application.yml durante las pruebas (no se mezcla con él):
# toda propiedad que necesite una prueba se repite aquí. Sin Config Server ni Eureka.
spring:
  application:
    name: report-service
  cloud:
    config:
      enabled: false

bank:
  zone: America/Lima
  clients:
    account-service:
      base-url: http://localhost:9999/api/v1
    credit-service:
      base-url: http://localhost:9999/api/v1
    transaction-service:
      base-url: http://localhost:9999/api/v1

report:
  source: rest
  max-range-days: 366
  max-movements: 5000
  page:
    max-size: 100
  last-movements:
    max: 50

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      credit-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      transaction-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      account-service:
        timeout-duration: 2s
        cancel-running-future: true
      credit-service:
        timeout-duration: 2s
        cancel-running-future: true
      transaction-service:
        timeout-duration: 2s
        cancel-running-future: true

# Sin registro en Eureka durante las pruebas.
eureka:
  client:
    enabled: false
